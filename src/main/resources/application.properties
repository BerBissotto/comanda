spring.application.name=comanda

server.address=0.0.0.0
server.port=8080
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Seguro por padrão. Em desenvolvimento local sem HTTPS: SESSION_COOKIE_SECURE=false
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}

# Credenciais do banco: SEM valor padrão (a aplicação não sobe sem elas).
# Defina DB_USERNAME e DB_PASSWORD como variáveis de ambiente ou num arquivo .env
# na raiz do projeto (ignorado pelo Git, veja .gitignore).
spring.config.import=optional:file:./.env[.properties]
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/Comanda}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:1526}

spring.web.resources.static-locations=classpath:/static/

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

app.security.login.max-attempts=${LOGIN_MAX_ATTEMPTS:5}
app.security.login.lock-duration=${LOGIN_LOCK_DURATION:15m}
