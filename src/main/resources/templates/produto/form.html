<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Novo produto')}"></head>
<body>
<header th:replace="~{fragments/layout :: topbar('produtos')}"></header>

<main class="container">
    <div class="page-head">
        <div>
            <h1 class="page-title">Novo produto</h1>
            <p class="muted">Preencha os dados e escolha uma imagem para o produto.</p>
        </div>
    </div>

    <div class="alert alert--erro" role="alert" th:if="${erro}">
        <strong>Não foi possível salvar.</strong> <span th:text="${erro}">Mensagem de erro</span>
    </div>

    <form class="card" th:action="@{/produtos/novo}" th:object="${produto}" method="post" enctype="multipart/form-data">
        <div class="form-grid">
            <div class="field">
                <label class="label" for="nome">Nome</label>
                <input class="input" id="nome" th:field="*{nome}" type="text" maxlength="120"
                       placeholder="Ex.: X-Burger" required autofocus>
            </div>

            <div class="field">
                <label class="label" for="categoria">Categoria</label>
                <input class="input" id="categoria" th:field="*{categoria}" type="text" maxlength="60"
                       placeholder="Ex.: Lanches">
            </div>

            <div class="field">
                <label class="label" for="preco">Preço (R$)</label>
                <input class="input" id="preco" th:field="*{preco}" type="number" inputmode="decimal"
                       min="0" step="0.01" placeholder="0,00" required>
            </div>

            <div class="field">
                <label class="label" for="quantidade">Quantidade em estoque</label>
                <input class="input" id="quantidade" th:field="*{quantidade}" type="number" inputmode="numeric"
                       min="0" step="1" placeholder="0" required>
            </div>

            <div class="field field--full">
                <label class="label" for="descricao">Descrição</label>
                <textarea class="input" id="descricao" th:field="*{descricao}" maxlength="500"
                          placeholder="Ingredientes, tamanho, observações…"></textarea>
            </div>

            <div class="field field--full">
                <span class="label" id="foto-label">Imagem do produto</span>
                <div class="upload">
                    <input class="visually-hidden" id="foto" name="foto" type="file" accept="image/*"
                           aria-labelledby="foto-label">
                    <label class="btn btn-ghost" for="foto">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg>
                        Escolher imagem
                    </label>
                    <span class="muted" id="foto-nome">Nenhuma imagem escolhida</span>
                    <button type="button" class="btn btn-ghost" id="foto-remover" hidden>Remover</button>
                </div>
                <p class="muted" id="foto-erro" role="alert" hidden></p>
                <div class="preview" id="preview" aria-live="polite">A pré-visualização aparece aqui</div>
            </div>
        </div>

        <div class="form-acoes">
            <a class="btn btn-ghost" th:href="@{/produtos}">Cancelar</a>
            <button class="btn btn-primary" type="submit">Salvar produto</button>
        </div>
    </form>
</main>

<script th:src="@{/js/produto-form.js}" defer></script>
</body>
</html>
