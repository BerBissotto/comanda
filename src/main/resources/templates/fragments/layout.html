<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<!-- Fragmentos compartilhados: <head>, barra superior e alternador de tema -->
<head th:fragment="head(titulo)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title th:text="${titulo} + ' · Comanda'">Comanda</title>
    <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">
    <link rel="preload" th:href="@{/css/fonts/Figtree-Regular.ttf}" as="font" type="font/ttf" crossorigin>
    <link rel="stylesheet" th:href="@{/css/dwerp.css}">
    <!-- tema salvo aplicado antes da primeira pintura -->
    <script th:src="@{/js/theme.js}"></script>
    <script th:src="@{/js/comanda-store.js}" defer></script>
    <script th:src="@{/js/ui.js}" defer></script>
</head>
<body>
<header class="app-header" th:fragment="topbar(ativo)">
    <div class="app-header__inner">
        <a class="brand" th:href="@{/produtos}">Comanda</a>

        <a class="nav-link" th:href="@{/produtos}" th:classappend="${ativo == 'produtos'} ? 'is-active'">Produtos</a>
        <a class="nav-link" th:href="@{/comanda}" th:classappend="${ativo == 'comanda'} ? 'is-active'">
            Comanda <span class="badge badge--accent" data-comanda-count aria-label="itens na comanda">0</span>
        </a>

        <button type="button" class="btn-icon theme-toggle" data-theme-toggle aria-pressed="false" aria-label="Alternar tema claro e escuro">
            <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>

        <form th:action="@{/logout}" method="post" data-logout>
            <button type="submit" class="nav-link">Sair</button>
        </form>
    </div>
</header>
</body>
</html>
